name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "refactor/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: every job only reads the repository. No job writes to GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder so prisma generate (run on install) can load prisma.config.ts.
  # Jobs that use a database override it with their own service connection.
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:writing
      - run: npm run check:deps
      - name: Unit and component tests with coverage
        run: npx vitest run --project unit --project component --coverage --reporter=default --reporter=junit --outputFile.junit=reports/unit-junit.xml
      - name: Module dependency graph for impact analysis
        if: always()
        run: npx depcruise src tools tests --config .dependency-cruiser.cjs --output-type json > reports/dependency-graph.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: ignore

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          # Throwaway credentials for a database that exists only for this job.
          POSTGRES_USER: unsaid
          POSTGRES_PASSWORD: unsaid_ci
          POSTGRES_DB: unsaid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unsaid -d unsaid_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://unsaid:unsaid_ci@localhost:5432/unsaid_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npx vitest run --project integration --reporter=default --reporter=junit --outputFile.junit=reports/integration-junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-reports
          path: reports/
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-junit
          path: reports/e2e-junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  visual:
    name: visual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The same pinned image as npm run test:visual:docker, so baselines made locally match CI.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright test --project=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          if-no-files-found: ignore

  # Observation mode: RiskPilot recommends the test files a pull request affects and explains why.
  # It never skips, gates or changes the jobs above, which still run every test.
  # It installs nothing from the pull request and runs no pull request code: it only reads Git objects.
  test-impact:
    name: test-impact (observation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RISKPILOT_REPOSITORY: qunoot-ahmed/riskpilot
      # A reviewed RiskPilot commit. Change it only after reviewing the RiskPilot diff.
      RISKPILOT_SHA: dfa09ea1dff4950aee5f69bbf3d36266fe8f40b8
    steps:
      - name: Check the RiskPilot pin is a full commit SHA
        run: |
          if [[ ! "$RISKPILOT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::RISKPILOT_SHA must be a full 40 character commit SHA, not a branch or tag."
            exit 1
          fi
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history so the merge base with the target branch can be found.
          fetch-depth: 0
          path: target
          persist-credentials: false
      - name: Check out RiskPilot at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RISKPILOT_REPOSITORY }}
          ref: ${{ env.RISKPILOT_SHA }}
          path: riskpilot
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: riskpilot/.nvmrc
      - name: Analyse test impact from the merge base
        # RiskPilot has no runtime dependencies, so nothing is installed.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          test "$(git -C riskpilot rev-parse HEAD)" = "$RISKPILOT_SHA"
          mkdir -p riskpilot-report
          node riskpilot/src/cli.ts target "$BASE_SHA" "$HEAD_SHA" --merge-base \
            --output riskpilot-report/report.json \
            --markdown riskpilot-report/summary.md \
            | tee riskpilot-report/summary.txt
      - name: Confirm the analysed checkout is unchanged
        run: |
          if [ -n "$(git -C target status --porcelain)" ]; then
            echo "::error::RiskPilot changed the analysed checkout."
            git -C target status --short
            exit 1
          fi
      - name: Publish the job summary
        if: always()
        run: |
          if [ -f riskpilot-report/summary.md ]; then
            cat riskpilot-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RiskPilot produced no report. No test recommendation was made; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: riskpilot-report
          path: riskpilot-report/
          if-no-files-found: warn
